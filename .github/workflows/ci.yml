name: Python CI

on:
  push:
    branches:
      - serclick-remote-research-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      HAS_ALPACA_SECRET: ${{ secrets.Alpaca != '' }}
      HAS_APCA_KEY_ID: ${{ secrets.APCA_API_KEY_ID != '' }}
      HAS_APCA_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
      - name: Compile Python
        run: python -m compileall -q scanner scripts
      - name: Check Alpaca secret names
        run: |
          echo "Alpaca=$HAS_ALPACA_SECRET"
          echo "APCA_API_KEY_ID=$HAS_APCA_KEY_ID"
          echo "APCA_API_SECRET_KEY=$HAS_APCA_SECRET_KEY"

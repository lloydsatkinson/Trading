name: Trading Lab CI

on:
  push:
    branches: [main, feat/small-cap-research-lab]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  intraday-research:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[intraday-run]')
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - id: creds
        shell: bash
        run: |
          if [[ -n "$APCA_API_KEY_ID" && -n "$APCA_API_SECRET_KEY" ]]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            mkdir -p output/intraday_tournament
            echo "Alpaca repository secrets are missing; research run not started." > output/intraday_tournament/status.txt
          fi
      - name: Run 60-session SIP tournament
        if: steps.creds.outputs.ok == 'true'
        run: python -m scripts.run_intraday_tournament --days 60 --end-date 2026-08-11 --feed sip --output output/intraday_tournament --slip-bps 20
      - name: Remove bulky minute cache from artifact
        if: always()
        run: rm -f output/intraday_tournament/history/minute_candidates.csv.gz || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intraday-small-cap-results
          path: output/intraday_tournament/
          retention-days: 14

  fixed-stop-research:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[fixed-stop-run]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: intraday-small-cap-results
          path: input/intraday
          github-token: ${{ github.token }}
          repository: lloydsatkinson/Trading
          run-id: 33214478726
      - name: Replay frozen candidates with 50 percent stop
        run: python -m scripts.run_fixed_stop_replay --input input/intraday --output output/fixed_stop_50 --stop-pct 0.50 --slip-bps 20 --feed sip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixed-stop-50-results
          path: output/fixed_stop_50/
          retention-days: 14

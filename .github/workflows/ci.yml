name: Trading Lab CI

on:
  push:
    branches: [main, feat/small-cap-research-lab]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  intraday-research:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[intraday-run]')
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - id: creds
        shell: bash
        run: |
          if [[ -n "$APCA_API_KEY_ID" && -n "$APCA_API_SECRET_KEY" ]]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            mkdir -p output/intraday_tournament
            echo "Alpaca repository secrets are missing; research run not started." > output/intraday_tournament/status.txt
          fi
      - name: Run 60-session SIP tournament
        if: steps.creds.outputs.ok == 'true'
        run: python -m scripts.run_intraday_tournament --days 60 --end-date 2026-08-11 --feed sip --output output/intraday_tournament --slip-bps 20
      - name: Remove bulky minute cache from artifact
        if: always()
        run: rm -f output/intraday_tournament/history/minute_candidates.csv.gz || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intraday-small-cap-results
          path: output/intraday_tournament/
          retention-days: 14

  fixed-stop-research:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[fixed-stop-run]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: intraday-small-cap-results
          path: input/intraday
          github-token: ${{ github.token }}
          repository: lloydsatkinson/Trading
          run-id: 33214478726
      - name: Replay frozen candidates with 50 percent stop
        run: python -m scripts.run_fixed_stop_replay --input input/intraday --output output/fixed_stop_50 --stop-pct 0.50 --slip-bps 20 --hold-minutes 45 --feed sip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixed-stop-50-results
          path: output/fixed_stop_50/
          retention-days: 14

  hold-time-research:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[hold-sweep-run]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: intraday-small-cap-results
          path: input/intraday
          github-token: ${{ github.token }}
          repository: lloydsatkinson/Trading
          run-id: 33214478726
      - name: Replay all hold times from one SIP data pass
        run: python -m scripts.run_fixed_stop_replay --input input/intraday --output output/hold_sweep --stop-pct 0.50 --slip-bps 20 --hold-sweep 5,10,15,20,30,45,60,90,120,180,300 --feed sip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hold-sweep-results
          path: output/hold_sweep/
          retention-days: 14

  parameter-sweep-research:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[param-sweep-run]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: intraday-small-cap-results
          path: input/intraday
          github-token: ${{ github.token }}
          repository: lloydsatkinson/Trading
          run-id: 33214478726
      - name: Replay stop and hold parameter grid from one SIP data pass
        run: python -m scripts.run_fixed_stop_replay --input input/intraday --output output/parameter_sweep --stop-sweep 0.05,0.075,0.10,0.125,0.15,0.20,0.30,0.50 --slip-bps 20 --hold-sweep 10,15,20,30,45,60,90,120,180 --feed sip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parameter-sweep-results
          path: output/parameter_sweep/
          retention-days: 14

  target-sweep-research:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[target-sweep-run]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: intraday-small-cap-results
          path: input/intraday
          github-token: ${{ github.token }}
          repository: lloydsatkinson/Trading
          run-id: 33214478726
      - name: Replay structural-R target ladder from one SIP data pass
        run: python -m scripts.run_target_sweep --input input/intraday --output output/target_sweep --target-sweep 0.5,1,1.5,2,2.5,3,4,5 --slip-bps 20 --feed sip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: target-sweep-results
          path: output/target_sweep/
          retention-days: 14

  final-holdout-research:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[final-holdout-run]')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Build untouched 12-session raw holdout
        run: python -m scripts.run_intraday_tournament --days 12 --end-date 2026-08-27 --feed sip --output output/final_raw --slip-bps 20
      - name: Score frozen rules at normal and 2x slippage
        run: python -m scripts.run_final_holdout --input output/final_raw --output output/final_holdout --feed sip --slip-bps 20
      - name: Remove bulky final minute cache
        if: always()
        run: rm -f output/final_raw/history/minute_candidates.csv.gz || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-holdout-results
          path: |
            output/final_holdout/
            output/final_raw/trades.csv
            output/final_raw/leaderboard.csv
            output/final_raw/summary.md
            output/final_raw/history/manifest.json
            output/final_raw/history/coarse_candidates.csv
          retention-days: 30

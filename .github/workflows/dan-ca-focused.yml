name: Dan Corporate Action Focused

on:
  push:
    branches:
      - dan-irish-research-v1
    paths:
      - tests/test_dan_corporate_action_audit.py
      - scanner/multistrategy/study.py
      - .github/workflows/dan-ca-focused.yml

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dan-irish-research-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Apply corporate action patch
        run: python .github/scripts/dan_ca_patch.py
      - name: Verify focused behavior
        run: pytest -q tests/test_dan_corporate_action_audit.py
      - name: Commit production fix if changed
        shell: bash
        run: |
          if git diff --quiet -- scanner/multistrategy/study.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scanner/multistrategy/study.py
          git commit -m "fix: harden Dan corporate action audit window"
          git push origin HEAD:dan-irish-research-v1

name: Dan Corporate Action Focused

on:
  push:
    branches:
      - dan-irish-research-v1
    paths:
      - tests/test_dan_corporate_action_audit.py
      - scanner/multistrategy/study.py
      - .github/workflows/dan-ca-focused.yml

jobs:
  focused:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dan-irish-research-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q tests/test_dan_corporate_action_audit.py

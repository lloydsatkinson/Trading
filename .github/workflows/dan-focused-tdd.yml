name: Dan Focused TDD

on:
  push:
    branches:
      - dan-irish-research-v1
    paths:
      - tests/test_alpaca_rest.py
      - tests/test_dan_dynamic_swing.py
      - tests/test_dan_market_data_integrity.py
      - tests/test_dan_runner_integration.py
      - scripts/run_strategy_research.py
      - scanner/core/multisession_replay.py
      - scanner/multistrategy/config.py
      - scanner/multistrategy/study.py
      - scanner/serclick/alpaca_rest.py
      - scanner/strategies/dan_irish/corporate_actions.py
      - scanner/strategies/dan_irish/research.py
      - scanner/strategies/dan_irish/rules.py
      - scanner/strategies/dan_irish/swing.py
      - .github/workflows/dan-focused-tdd.yml

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dan-irish-research-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. pytest -q tests/test_alpaca_rest.py tests/test_dan_dynamic_swing.py tests/test_dan_market_data_integrity.py tests/test_dan_runner_integration.py

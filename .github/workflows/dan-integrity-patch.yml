name: Dan Integrity Patch

on:
  push:
    branches:
      - dan-irish-research-v1

permissions:
  contents: write

concurrency:
  group: dan-integrity-patch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-study-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dan-irish-research-v1
      - name: Patch session split metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scanner/multistrategy/study.py')
          text = path.read_text(encoding='utf-8')
          marker = '                "split_end_dates": _split_end_dates(split_map),\n'
          addition = '                "session_splits": {str(day): str(split) for day, split in split_map.items()},\n'
          if addition in text:
              print('session_splits already present')
          else:
              if marker not in text:
                  raise SystemExit('expected split_end_dates marker not found')
              path.write_text(text.replace(marker, marker + addition, 1), encoding='utf-8')
          PY
      - name: Commit patch if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scanner/multistrategy/study.py
          git commit -m "fix: expose chronological session split map"
          git push origin HEAD:dan-irish-research-v1

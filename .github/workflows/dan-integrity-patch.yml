name: Dan Integrity Patch

on:
  push:
    branches:
      - dan-irish-research-v1
    paths:
      - .github/workflows/dan-integrity-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dan-irish-research-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply integrity patch
        run: python .github/scripts/dan_integrity_patch.py
      - name: Commit integrity patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scanner/core/multisession_replay.py scanner/strategies/dan_irish/research.py
          git commit -m "fix: preserve Dan gap and session integrity"
          git push origin HEAD:dan-irish-research-v1

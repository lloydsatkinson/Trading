name: Dan Intraday Precompute Focused

on:
  push:
    branches:
      - dan-irish-research-v1
    paths:
      - .github/workflows/dan-intraday-precompute-focused.yml

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dan-irish-research-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Apply intraday precompute patch
        run: python .github/scripts/dan_intraday_precompute_patch.py
      - name: Verify focused precompute contracts
        run: pytest -q tests/test_dan_research_performance.py tests/test_dan_intraday.py tests/test_dan_completion.py tests/test_dan_intraday_impulse_peak.py
      - name: Commit production precompute if changed
        shell: bash
        run: |
          if git diff --quiet -- scanner/strategies/dan_irish/intraday.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scanner/strategies/dan_irish/intraday.py
          git commit -m "perf: prepare Dan intraday features once per candidate"
          git push origin HEAD:dan-irish-research-v1

name: Dan Runner Grid Patch

on:
  push:
    branches:
      - dan-irish-research-v1
    paths:
      - .github/workflows/dan-runner-grid-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dan-irish-research-v1
          fetch-depth: 0
      - name: Wire full Dan intraday setup grid
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scanner/strategies/dan_irish/research.py')
          text = path.read_text(encoding='utf-8')
          old_import = 'from .intraday import generate_dan_intraday_signals'
          new_import = 'from .intraday import generate_dan_intraday_signal_grid'
          old_call = 'intraday = generate_dan_intraday_signals(day0_bars, context, cfg)'
          new_call = 'intraday = generate_dan_intraday_signal_grid(day0_bars, context, cfg)'
          if text.count(old_import) != 1 or text.count(old_call) != 1:
              raise SystemExit('expected Dan runner patch anchors not found exactly once')
          text = text.replace(old_import, new_import).replace(old_call, new_call)
          path.write_text(text, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scanner/strategies/dan_irish/research.py
          git commit -m 'feat: run full Dan intraday setup grid'
          git push origin HEAD:dan-irish-research-v1

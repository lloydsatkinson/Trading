name: Dan Runner Threshold Patch

on:
  push:
    branches:
      - dan-irish-research-v1

permissions:
  contents: write

jobs:
  patch-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dan-irish-research-v1
      - name: Patch runner threshold output
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/run_strategy_research.py')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              '    generate_dan_signal_set,\n    replay_dan_swing_signals,\n    run_study_with_optional_dan,\n',
              '    generate_dan_signal_set,\n    persist_dan_rule_identity,\n    replay_dan_swing_signals,\n    run_study_with_optional_dan,\n    summarize_dan_threshold_grid,\n',
              1,
          )
          text = text.replace(
              '    overnight_gap_risk: pd.DataFrame\n    censor_summary: pd.DataFrame\n',
              '    overnight_gap_risk: pd.DataFrame\n    censor_summary: pd.DataFrame\n    dan_threshold_summary: pd.DataFrame\n',
              1,
          )
          text = text.replace(
              '    replays = pd.concat(replay_frames, ignore_index=True, sort=False) if replay_frames else pd.DataFrame()\n    replays = add_retained_gain_bucket(replays)\n    skips = pd.concat(skip_frames, ignore_index=True, sort=False) if skip_frames else pd.DataFrame()\n',
              '    replays = pd.concat(replay_frames, ignore_index=True, sort=False) if replay_frames else pd.DataFrame()\n    replays = add_retained_gain_bucket(replays)\n    if not replays.empty and "strategy_id" in replays.columns:\n        dan_mask = replays["strategy_id"].astype(str).eq("DAN_IRISH")\n        if dan_mask.any():\n            dan_identified = persist_dan_rule_identity(replays.loc[dan_mask].copy())\n            replays = pd.concat([replays.loc[~dan_mask].copy(), dan_identified], ignore_index=True, sort=False)\n    skips = pd.concat(skip_frames, ignore_index=True, sort=False) if skip_frames else pd.DataFrame()\n',
              1,
          )
          text = text.replace(
              '    censor_summary = dan_summaries["censor_summary"]\n\n    ranking_source = summary.copy()\n',
              '    censor_summary = dan_summaries["censor_summary"]\n    dan_threshold_summary = summarize_dan_threshold_grid(dan_replays)\n\n    ranking_source = summary.copy()\n',
              1,
          )
          text = text.replace(
              '    censor_summary.to_csv(output_dir / "censor_summary.csv", index=False)\n    skips.to_csv(output_dir / "skips.csv", index=False)\n',
              '    censor_summary.to_csv(output_dir / "censor_summary.csv", index=False)\n    dan_threshold_summary.to_csv(output_dir / "dan_threshold_summary.csv", index=False)\n    skips.to_csv(output_dir / "skips.csv", index=False)\n',
              1,
          )
          text = text.replace(
              '    censor_summary.to_csv(latest / "dan_censor_summary.csv", index=False)\n    (latest / "multistrategy_news.md").write_text(news, encoding="utf-8")\n',
              '    censor_summary.to_csv(latest / "dan_censor_summary.csv", index=False)\n    dan_threshold_summary.to_csv(latest / "dan_threshold_summary.csv", index=False)\n    (latest / "multistrategy_news.md").write_text(news, encoding="utf-8")\n',
              1,
          )
          text = text.replace(
              '        overnight_gap_risk=overnight_gap_risk,\n        censor_summary=censor_summary,\n    )\n',
              '        overnight_gap_risk=overnight_gap_risk,\n        censor_summary=censor_summary,\n        dan_threshold_summary=dan_threshold_summary,\n    )\n',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/run_strategy_research.py
          git commit -m 'feat: export Dan threshold research grid'
          git push origin HEAD:dan-irish-research-v1

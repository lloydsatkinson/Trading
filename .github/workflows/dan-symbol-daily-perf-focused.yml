name: Dan Symbol Daily Performance Focused

on:
  push:
    branches:
      - dan-irish-research-v1
    paths:
      - .github/workflows/dan-symbol-daily-perf-focused.yml

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dan-irish-research-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Apply symbol-daily reuse patch
        run: python .github/scripts/dan_symbol_daily_perf_patch.py
      - name: Verify focused performance contracts
        run: pytest -q tests/test_dan_research_performance.py tests/test_dan_intraday_impulse_peak.py
      - name: Commit production reuse if changed
        shell: bash
        run: |
          if git diff --quiet -- scanner/strategies/dan_irish/research.py scanner/strategies/dan_irish/swing.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scanner/strategies/dan_irish/research.py scanner/strategies/dan_irish/swing.py
          git commit -m "perf: reuse prepared symbol daily bars for Dan swing"
          git push origin HEAD:dan-irish-research-v1

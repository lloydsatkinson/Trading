name: Dan Threshold Fix

on:
  push:
    branches:
      - dan-irish-research-v1

permissions:
  contents: write

jobs:
  fix-threshold-typo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dan-irish-research-v1
      - name: Fix threshold mean R expression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scanner/strategies/dan_irish/research.py')
          text = path.read_text(encoding='utf-8')
          bad = '"mean_r": float( r/values.mean() ) if not r_values.empty else np.nan,'
          good = '"mean_r": float(r_values.mean()) if not r_values.empty else np.nan,'
          if bad not in text and good not in text:
              raise SystemExit('expected mean_r expression not found')
          path.write_text(text.replace(bad, good, 1), encoding='utf-8')
          PY
      - name: Commit fix if needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scanner/strategies/dan_irish/research.py
          git commit -m "fix: correct Dan threshold mean R metric"
          git push origin HEAD:dan-irish-research-v1

name: Dan Threshold Patch

on:
  push:
    branches:
      - dan-irish-research-v1

permissions:
  contents: write

jobs:
  patch-threshold-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dan-irish-research-v1
      - name: Patch Dan threshold research helpers
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          path = Path("scanner/strategies/dan_irish/research.py")
          text = path.read_text(encoding="utf-8")
          old_import = "from scanner.core.reporting import summarize_censoring, summarize_strategy_replays, summarize_swing_holds\n"
          new_import = "from scanner.core.reporting import max_drawdown, profit_factor, summarize_censoring, summarize_strategy_replays, summarize_swing_holds\n"
          if old_import in text:
              text = text.replace(old_import, new_import, 1)

          old_config = "from .config import DanConfig\n"
          new_config = "from .config import (\n    DanConfig,\n    IMPULSE_GRID,\n    PULLBACK_DEPTH_GRID,\n    RETAINED_GAIN_GRID,\n    TURNOVER_GRID,\n)\n"
          if old_config in text:
              text = text.replace(old_config, new_config, 1)

          addition = base64.b64decode("").decode("utf-8")
          marker = "\ndef retained_gain_bucket(value) -> str:\n"
          if "def persist_dan_rule_identity(" not in text:
              if marker not in text:
                  raise SystemExit("retained_gain_bucket marker not found")
              text = text.replace(marker, addition + marker, 1)

          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit patch if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scanner/strategies/dan_irish/research.py
          git commit -m "feat: add auditable Dan threshold grid"
          git push origin HEAD:dan-irish-research-v1

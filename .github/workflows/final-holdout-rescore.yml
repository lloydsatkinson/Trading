name: Final Holdout Corrected Rescore

on:
  push:
    branches: [feat/small-cap-research-lab]

permissions:
  contents: read
  actions: read

jobs:
  corrected-rescore:
    if: contains(github.event.head_commit.message, '[final-rescore-run]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: final-holdout-results
          path: input/final
          github-token: ${{ github.token }}
          repository: lloydsatkinson/Trading
          run-id: 33553451248
      - name: Re-score frozen holdout with corrected entry and exit slippage
        run: python -m scripts.run_final_holdout --input input/final/final_raw --output output/final_holdout_corrected --feed sip --slip-bps 20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-holdout-corrected-results
          path: output/final_holdout_corrected/
          retention-days: 30

name: SerClick Daily Research

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * 2-6"

permissions:
  contents: read

jobs:
  daily-research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
      APCA_API_BASE_URL: https://paper-api.alpaca.markets
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Restore SerClick market-data cache
        uses: actions/cache@v4
        with:
          path: data/cache/serclick_alpaca
          key: serclick-daily-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            serclick-daily-${{ runner.os }}-
            serclick-60d-${{ runner.os }}-
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit tests
        run: pytest -q
      - name: Run latest completed session
        run: python scripts/run_remote_pipeline.py --feed sip --sessions 1
      - name: Publish news to job summary
        if: always()
        shell: bash
        run: |
          if [ -f data/latest/serclick_news.md ]; then
            cat data/latest/serclick_news.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "SerClick pipeline did not produce news.md. Inspect logs." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload daily research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serclick-daily-${{ github.run_id }}
          path: |
            data/latest/
            data/research/serclick_alpaca/
          if-no-files-found: warn
          retention-days: 30
